onboarding = false
# Herdr reads this file from ~/.config/herdr/config.toml.
# Defaults remain active for anything not listed here.

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+a"

previous_tab = ["prefix+y"]
next_tab = ["prefix+u"]
new_tab = ["prefix+c"]
switch_tab = ["prefix+1..9"]

split_vertical = ["prefix+v"]
split_horizontal = ["prefix+minus"]

settings = ["prefix+shift+s"]
goto = ["prefix+s"]
toggle_sidebar = ["prefix+e"]
copy_mode = ["prefix+b"]

navigate_workspace_down = "j"
navigate_workspace_up = "k"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "tuicr -w"
description = "review uncommitted changes with tuicr"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "btop"
description = "run btop"
width = "80%"
height = "80%"
